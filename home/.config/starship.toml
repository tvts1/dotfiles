"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 800

format = """
[╭─](overlay0)\
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$java\
$nodejs\
$package\
$docker_context\
$cmd_duration\
$line_break\
[╰─](overlay0)$character
"""

palette = "catppuccin_macchiato"

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#181926"

[os]
disabled = false
style = "bold mauve"

[os.symbols]
Arch = "󰣇 "

[username]
show_always = false
style_user = "bold blue"
format = "[$user]($style) "

[hostname]
ssh_only = true
style = "bold green"
format = "[@$hostname]($style) "

[directory]
style = "bold blue"
read_only = " 󰌾"
truncation_length = 4
truncate_to_repo = false
format = "[$path]($style)[$read_only]($read_only_style) "

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Projects" = "󰲋 "
".config" = " "

[git_branch]
symbol = " "
style = "bold mauve"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold peach"
format = "([$all_status$ahead_behind]($style) )"

[java]
symbol = " "
style = "bold red"
format = "via [$symbol($version)]($style) "

[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol($version)]($style) "

[package]
symbol = "󰏗 "
style = "bold peach"
format = "is [$symbol$version]($style) "

[docker_context]
symbol = " "
style = "bold blue"
format = "via [$symbol$context]($style) "

[cmd_duration]
min_time = 1000
style = "bold yellow"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
